name: Release Please

on:
  push:
    branches: [main]

# release-please acts with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN: a pull
# request opened with GITHUB_TOKEN does not trigger CI, so the release PR
# would never get the required ci-ok check.
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Each action's commit SHA is pinned in .github/workflows/actions.lock.
      - uses: googleapis/release-please-action@v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
