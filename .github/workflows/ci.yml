name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run catches new advisories (Go standard library included) and
  # upstream breakage between dependency update PRs. Sunday 21:00 UTC is
  # Monday 06:00 JST, just before Dependabot's Monday batch.
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Third-party actions are pinned to a full commit SHA in
      # .github/workflows/actions.lock (generated by `gh actions-lock`). The
      # locked commit is what runs, even if the tag is later moved.
      # Dependabot updates the version here and the lockfile together.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        # Version pinned in tools/go.mod (a separate module, so genpw itself
        # stays dependency-free); Dependabot keeps it current.
        run: go tool -modfile=tools/go.mod staticcheck ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test -race ./...

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck
        # Fails only on vulnerabilities reachable from genpw's code, checked
        # against the Go version in go.mod (the one releases are built with).
        run: go tool -modfile=tools/go.mod govulncheck ./...

  # Single required check for the branch ruleset, so adding or renaming jobs
  # never needs a ruleset change.
  ci-ok:
    if: always()
    needs: [test, govulncheck]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - run: echo ok
