name: Release

on:
  push:
    tags: ['v*']

# Default to no permissions; grant write only to the job that needs it.
permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload artifacts
    steps:
      # Each action's commit SHA is pinned in .github/workflows/actions.lock
      # (supply-chain hardening); see the note in ci.yml.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          # Pin the GoReleaser binary to an exact version (not a floating range).
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish draft (locks assets, makes the release immutable)
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
